<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pelea Callejera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
  /* Layout: pantalla 16:9 arriba y controles táctiles abajo; en celular horizontal los controles flotan sobre la pantalla. */
  :root {
    --bg: #17171b;
    --fg: #f4efe0;
    --ink: #141414;
    --btn: #2b2b33;
    --line: #5a5a66;
    --hot: #ffd23f;
    --muted: #a39f92;
    --guard: #2f4f6b;
    --b: clamp(42px, 12.6vw, 70px);
    --display: Bangers, Impact, "Arial Narrow Bold", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; width: 100%; max-width: 900px; min-width: 0; }
  #screen { position: relative; aspect-ratio: 16 / 9; width: 100%; border: 3px solid var(--line); border-radius: 10px; overflow: hidden; background: #f3e8c8; box-sizing: border-box; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #pad {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding: 12px 0 4px; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .grid { display: grid; gap: 6px; }
  .dpad { grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(2, var(--b)); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .acts { grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(2, var(--b)); }
  .acts .guard { grid-column: 1; grid-row: 1 / span 2; }
  .acts [data-k="jab"] { grid-column: 2; grid-row: 1; }
  .acts [data-k="heavy"] { grid-column: 2; grid-row: 2; }
  .acts [data-k="khi"] { grid-column: 3; grid-row: 1; }
  .acts [data-k="klo"] { grid-column: 3; grid-row: 2; }
  .btn {
    width: 100%; height: 100%; border-radius: 16px; box-sizing: border-box;
    border: 3px solid var(--line); background: var(--btn); color: var(--fg);
    font: 400 clamp(11px, 3.1vw, 19px)/1 var(--display); letter-spacing: .02em;
    display: grid; place-items: center; padding: 0; min-width: 0; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  .btn.arrow { font-size: clamp(18px, 5vw, 26px); }
  .btn.punch { background: #3a2a2a; border-color: #7a4a4a; }
  .btn.kick { background: #2a3a2f; border-color: #4a7a5a; }
  .btn.two { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: clamp(10px, 2.8vw, 15px); line-height: 1.05; letter-spacing: .01em; }
  .btn.guard { background: var(--guard); border-color: #5f8fb8; }
  .btn.on { background: var(--hot); border-color: var(--hot); color: var(--ink); transform: translateY(2px); }
  .btn:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }
  #hint { margin: 6px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); text-align: center; text-wrap: balance; max-width: 62ch; }

  @media (orientation: landscape) and (max-height: 620px) {
    :root { --b: 50px; }
    #app { height: 100%; display: flex; justify-content: center; max-width: 100%; }
    #screen { height: 100%; width: auto; aspect-ratio: 16 / 9; max-width: 100%; }
    #pad { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px 8px; pointer-events: none; }
    .btn { pointer-events: auto; opacity: .62; }
    .btn.on { opacity: 1; }
    #hint { display: none; }
  }
  .menubtn {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 2;
    font: 400 12px/1 var(--display); letter-spacing: .06em; color: var(--ink);
    background: rgba(255,255,255,.6); border: 2px solid var(--ink); border-radius: 8px; padding: 5px 10px;
    cursor: pointer; touch-action: manipulation;
  }
  .menubtn:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

  /* Menú: video de fondo, título y Start flotando. */
  #menu {
    position: fixed; inset: 0; z-index: 100; background: #000; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #menu[hidden] { display: none; }
  #bgv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #menu .veil { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,.18) 0%, rgba(0,0,0,.66) 100%); }
  .menu-inner {
    position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .float { animation: bob 5s ease-in-out infinite; will-change: transform; }
  .float.s { animation-duration: 3.8s; animation-delay: -1.4s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-.6deg); }
    50% { transform: translateY(-12px) rotate(.6deg); }
  }
  .titlewrap { position: relative; display: block; width: min(88vw, 760px, 118vh); line-height: 0; }
  .title { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); pointer-events: none; }

  @keyframes shine {
    0% { background-position: 100% 0; }
    24% { background-position: 0% 0; }
    100% { background-position: 0% 0; }
  }
  /* El botón es un cuadrado: se puede tocar en cualquier parte, no solo sobre las letras. */
  .startbox {
    --sq: min(56vw, 300px);
    width: var(--sq); aspect-ratio: 1 / 1; margin-block: calc(var(--sq) * -.2);
    display: grid; place-items: center; padding: 0; border: 0; background: transparent; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .startimg {
    width: 92%; height: auto; display: block; pointer-events: none;
    transition: transform .18s ease, filter .18s ease; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  .startbox:hover .startimg, .startbox:focus-visible .startimg { transform: scale(1.16); filter: drop-shadow(0 8px 20px rgba(0,0,0,.55)) brightness(1.08); }
  .startbox:active .startimg { transform: scale(1.06); }
  .startbox:focus-visible { outline: 3px dashed rgba(255,255,255,.65); outline-offset: -6px; border-radius: 18px; }
  #snd {
    position: absolute; z-index: 2; min-height: 44px; padding: 8px 14px; cursor: pointer;
    right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px));
    font: 400 15px/1 var(--display); letter-spacing: .05em; color: #fff;
    background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.55); border-radius: 12px;
  }
  #snd:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
  @media (max-height: 520px) {
    .titlewrap { width: min(70vw, 560px, 105vh); }
    .startbox { --sq: min(34vw, 50vh, 260px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.on { transform: none; }
    .float, .shine { animation: none; }
    .startimg { transition: none; }
  }

  /* Selección de alumno / escenario */
  #pick{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,14px);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));box-sizing:border-box}
  #menu.picking #snd{display:none}
  #pktitle{width:min(86vw,620px)}
  #pktitle canvas,#pvname canvas,#svname canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
  .pk-body{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vh,14px);width:100%;min-height:0}
  .pk-prev{display:flex;flex-direction:column;align-items:center;gap:6px}
  #pvname,#svname{width:min(56vw,240px)}
  #pv{height:clamp(130px,34vh,300px);width:auto;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #ff3fa4);animation:pop .28s ease-out}
  #sv{width:min(92vw,calc(30vh * 1.78));height:auto;aspect-ratio:16/9;border:3px solid #ff3fa4;border-radius:8px;box-shadow:0 0 22px rgba(255,63,164,.7);animation:pop .28s ease-out}
  @keyframes pop{from{transform:translateY(16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  .pk-grid{display:grid;gap:clamp(6px,1.4vw,12px);justify-content:center}
  #roster{grid-template-columns:repeat(6,clamp(52px,10vh,84px))}
  #stagelist{grid-template-columns:repeat(4,clamp(78px,17vh,140px))}
  .tile{padding:0;border:3px solid rgba(255,255,255,.45);border-radius:10px;background:linear-gradient(#efe6cc,#b9ae90);cursor:pointer;overflow:hidden;touch-action:manipulation;transition:transform .12s,box-shadow .12s;aspect-ratio:1/1;display:block}
  .tile.st{aspect-ratio:16/9}
  .tile canvas{width:100%;height:100%;display:block;pointer-events:none}
  .tile.on{border-color:#ff3fa4;transform:scale(1.08);box-shadow:0 0 0 2px #7dff2a,0 0 20px #ff3fa4}
  .tile:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
  .pk-actions{display:flex;gap:14px}
  .gbtn{border:3px solid rgba(255,255,255,.5);border-radius:12px;background:rgba(8,8,14,.7);padding:6px 16px;cursor:pointer;min-height:44px;touch-action:manipulation}
  .gbtn.ok{border-color:#7dff2a;box-shadow:0 0 14px rgba(125,255,42,.6)}
  .gbtn canvas{height:clamp(26px,5vh,38px);width:auto;display:block;pointer-events:none}
  @media (max-width:520px){#roster{grid-template-columns:repeat(3,clamp(60px,9vh,84px))}#stagelist{grid-template-columns:repeat(2,clamp(110px,28vw,160px))}}
  @media (max-height:520px){#pktitle{width:min(58vw,400px)}.pk-body{gap:4px}}
  @media (prefers-reduced-motion:reduce){#pv,#sv{animation:none}}
  .duel{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,8vw,90px)}
  .side{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(40vw,200px)}
  .side canvas.tg,.side .nm canvas{display:block;width:100%;height:auto}
  .tag{width:54px}.tag canvas{display:block;width:100%;height:auto}
  #pv,#pv2{height:clamp(120px,30vh,270px);width:auto;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #ff3fa4);animation:pop .28s ease-out}
  #pv2{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #7dff2a)}
  #pvname,#pv2name{width:100%;min-height:20px}#pvname canvas,#pv2name canvas{display:block;width:100%;height:auto}
  #roster{grid-template-columns:repeat(6,clamp(46px,8.5vh,70px))}
  .tile.on2{border-color:#7dff2a;transform:scale(1.08);box-shadow:0 0 0 2px #ff3fa4,0 0 20px #7dff2a}
  .tile.p1{border-color:#ff3fa4}.tile.lock{opacity:.55;cursor:not-allowed}
  #modelist{display:flex;flex-direction:column;gap:clamp(12px,2.4vh,20px);width:min(86vw,420px)}
  .mode{position:relative;display:flex;justify-content:center;padding:12px 18px;border:3px solid rgba(255,255,255,.45);border-radius:12px;background:rgba(8,8,14,.72);cursor:pointer;min-height:56px;touch-action:manipulation}
  .mode canvas{height:clamp(24px,4.6vh,34px);width:auto;display:block;pointer-events:none}
  .mode .soon{position:absolute;top:-11px;right:10px;height:20px;width:auto}
  .mode.on{border-color:#ff3fa4;box-shadow:0 0 0 2px #7dff2a,0 0 20px #ff3fa4}.mode.lock{opacity:.6}
  @media (max-width:520px){#roster{grid-template-columns:repeat(4,clamp(54px,9vh,76px))}}
</style>

<div id="app">
  <div id="screen">

    <button type="button" id="menubtn" class="menubtn">MENÚ</button>
  </div>
  <div id="pad">
    <div class="grid dpad" role="group" aria-label="Movimiento">
      <button type="button" class="btn arrow up" data-k="up" aria-label="Saltar">▲</button>
      <button type="button" class="btn arrow" data-k="left" aria-label="Izquierda" style="grid-row:2;grid-column:1">◀</button>
      <button type="button" class="btn arrow" data-k="down" aria-label="Agacharse" style="grid-row:2;grid-column:2">▼</button>

    </div>

      <button type="button" class="btn guard" data-k="block">BLOQ</button>

      <button type="button" class="btn punch two" data-k="heavy" aria-label="Golpe medio"><span>GOLPE</span><span>MEDIO</span></button>
      <button type="button" class="btn kick two" data-k="khi" aria-label="Patada alta"><span>PATADA</span><span>ALTA</span></button>
      <button type="button" class="btn kick two" data-k="klo" aria-label="Patada baja"><span>PATADA</span><span>BAJA</span></button>
    </div>
  </div>
  <p id="hint">Teclado: ← → mover · ↑ saltar · ↓ agacharse · I golpe alto · J golpe medio · K patada alta · L patada baja · Shift bloquear · Esc menú. En el aire o agachado, K y L hacen la misma patada. También anda con control de Xbox.</p>
</div>

  // I = golpe alto, J = golpe medio, K = patada alta, L = patada baja.

  const keys = new Set(), touch = {};
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',
    ArrowUp: 'up', KeyW: 'up', ShiftLeft: 'block', ShiftRight: 'block', KeyB: 'block',
    KeyI: 'jab', KeyJ: 'heavy', KeyK: 'khi', KeyL: 'klo'
  };
  addEventListener('keydown', e => {
    if (!running) {
      if (e.target && e.target.id === 'snd') return;
      menuKey(e); return;
    }
    if (e.code === 'Escape') { showMenu(); return; }
    const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); keys.add(k); wake();
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
  addEventListener('blur', () => keys.clear());
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); touch[k] = 1; b.classList.add('on'); wake(); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { touch[k] = 0; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
  });

  function readPad() {
    const r = {};
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p) continue;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = i => p.buttons[i] && p.buttons[i].pressed;
      if (ax < -0.4 || b(14)) r.left = 1;
      if (ax > 0.4 || b(15)) r.right = 1;
      if (ay > 0.5 || b(13)) r.down = 1;
      if (ay < -0.6 || b(12)) r.up = 1;                 // arriba = saltar
      if (b(3)) r.jab = 1;                              // Y = golpe alto
      if (b(2)) r.heavy = 1;                            // X = golpe medio
      if (b(1)) r.khi = 1;                              // B = patada alta
      if (b(0)) r.klo = 1;                              // A = patada baja
      if (b(4) || b(5) || b(6) || b(7)) r.block = 1;    // LB RB LT RT
    }
    return r;
  }

  const prev = {}, buf = { jab: 0, heavy: 0, khi: 0, klo: 0, up: 0 };
  function pollInput() {
    const gp = readPad(), cur = {};
    for (const k of BTN) cur[k] = (keys.has(k) || touch[k] || gp[k]) ? 1 : 0;
    for (const k of ['jab', 'heavy', 'khi', 'klo', 'up']) {
      if (cur[k] && !prev[k]) buf[k] = k === 'up' ? 6 : 9;
      prev[k] = cur[k];
      if (buf[k] > 0) buf[k]--;
    }
    return { left: cur.left, right: cur.right, down: cur.down, block: cur.block,
             up: buf.up > 0 ? 1 : 0, jab: buf.jab > 0 ? 1 : 0, heavy: buf.heavy > 0 ? 1 : 0,
             khi: buf.khi > 0 ? 1 : 0, klo: buf.klo > 0 ? 1 : 0 };
  }
  const consume = () => { buf.jab = buf.heavy = buf.khi = buf.klo = buf.up = 0; };

  // ---- Sonido mínimo (se activa con el primer toque) ---------------------------------------
  let ac = null;
  function wake() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (_) {} }
  function blip(f0, f1, dur, type, vol) {
    if (!ac) return;
    try {
      const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (_) {}
  }

  // ---- Estado del juego -----------------------------------------------------------------------
  const mk = (x, face, set) => ({
    x, z: 0, vz: 0, jvx: 0, jumping: false, airUsed: false, land: 0, face, set,
    hp: MAXHP, chip: MAXHP, crouch: false, block: false, blockT: 0,
    walk: 0, wp: 0, atk: null, hitstun: 0, kvx: 0, flash: 0, ko: false, koT: 0
  });
  let P, C, over, winner, overT, intro, freeze, shake, sparks, atkId = 0;
  const wins = { p: 0, c: 0 };
  const ai = { cool: 30, mode: '', timer: 0, seen: 0 };

  function reset() {
    P = mk(250, 1, 'r' + sel.p); C = mk(550, -1, 'r' + sel.c + (sel.c === sel.p ? 'b' : ''));
    over = false; winner = ''; overT = 0; intro = 70; freeze = 0; shake = 0; sparks = [];
    ai.cool = 40; ai.mode = ''; ai.timer = 0; ai.seen = 0;
    consume();
  }

  const isCrouch = f => f.atk ? !!f.atk.m.crouch : (!f.jumping && f.crouch);

  function startAtk(f, name) {
    const m = MOVES[name];
    f.atk = { m, t: 0, hit: false, id: ++atkId };
    f.walk = 0; f.block = false;
    if (m.air) f.airUsed = true;
    blip(name.indexOf('kick') >= 0 ? 200 : 340, 120, 0.09, 'triangle', 0.05);
    if (f === P) consume();
  }

  function physics(f, o) {
    if (!f.jumping) return;
    f.x += f.jvx; f.vz -= GRAV; f.z += f.vz;
    if (f.z <= 0) {
      f.z = 0; f.vz = 0; f.jumping = false; f.jvx = 0; f.land = 6;
      if (f.atk && f.atk.m.air) f.atk = null;
      f.face = o.x >= f.x ? 1 : -1;
    }
  }

  function updateF(f, o, inp) {
    physics(f, o);
    if (f.ko) { f.koT++; return; }
    if (f.hitstun > 0) { f.hitstun--; f.x += f.kvx; f.kvx *= 0.86; f.walk = 0; return; }
    if (f.atk) {
      const a = f.atk; a.t++;
      if (a.m.lunge && a.t >= a.m.su && a.t < a.m.su + a.m.ac) f.x += f.face * a.m.lunge;
      if (a.t >= a.m.su + a.m.ac + a.m.rc) f.atk = null;
      return;
    }
    if (f.jumping) {                                   // ataques en el aire (uno por salto)
      if (!f.airUsed) {
        if (inp.khi || inp.klo) startAtk(f, 'air_kick');          // en el aire K y L son la misma patada
        else if (inp.jab || inp.heavy) startAtk(f, 'air_punch');
      }
      return;
    }
    f.face = o.x >= f.x ? 1 : -1;
    if (f.land > 0) { f.land--; f.walk = 0; return; }
    const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    f.block = !!inp.block;
    f.crouch = !!inp.down;
    if (f.block) { f.walk = 0; return; }               // bloqueando: quieto, inclinado hacia atrás
    const sp = f.crouch ? CSPEED : SPEED;
    f.x += dir * sp; f.walk = dir; f.wp += dir * f.face * sp;
    if (inp.up && !f.crouch) {                         // saltar
      f.jumping = true; f.vz = JUMPV; f.z = 0.01; f.jvx = dir * SPEED * 1.2; f.airUsed = false; f.walk = 0;
      blip(260, 520, 0.12, 'sine', 0.05);
      if (f === P) consume();
      return;
    }
    // Agachado: K y L hacen la misma patada baja (c_kick); cada ataque usa un solo sprite.
    if (inp.khi) startAtk(f, f.crouch ? 'c_kick' : 'kick_hi');
    else if (inp.klo) startAtk(f, f.crouch ? 'c_kick' : 'kick_lo');
    else if (inp.heavy) startAtk(f, f.crouch ? 'c_heavy' : 'heavy');
    else if (inp.jab) startAtk(f, f.crouch ? 'c_jab' : 'jab');
  }

  function tryHit(a, d) {
    if (!a.atk || a.atk.hit || d.ko) return;
    const m = a.atk.m, t = a.atk.t;
    if (t < m.su || t >= m.su + m.ac) return;
    const S = SPR[m.frame];
    const reach = (S.tipx - S.ax) * SC;
    const fy = (S.h - S.tipy) * SC + a.z;              // altura del golpe sobre el piso
    const tip = a.x + a.face * reach;
    const x0 = Math.min(tip, tip - a.face * 38), x1 = Math.max(tip, tip - a.face * 38);
    const dc = isCrouch(d), bw = dc ? BWC : BWS, hgt = dc ? CH : SH;
    if (x1 < d.x - bw * 0.42 || x0 > d.x + bw * 0.42) return;
    if (fy > d.z + hgt + 4 || fy < d.z - 4) return;    // pasa por arriba (agachado) o por abajo (saltando)
    a.atk.hit = true;
    const blocked = d.block && !d.jumping && !d.atk && d.hitstun <= 0;
    const heavy = m.dmg > 10;
    if (blocked) {                                     // esquiva por poco: llega a rozar, saca poca vida
      d.hp = Math.max(0, d.hp - Math.max(1, Math.round(m.dmg * GUARD_DMG)));
      d.hitstun = Math.round(m.hs * 0.45); d.kvx = a.face * m.kb * 0.8; d.blockT = 14;
      freeze = 2; shake = 2;
      sparks.push({ x: tip, y: GROUND - fy, life: 18, txt: '¡CASI!', big: false, col: '#7fd0ff' });
      blip(300, 160, 0.08, 'triangle', 0.06);
    } else {
      d.atk = null; d.block = false; d.hp = Math.max(0, d.hp - m.dmg);
      d.hitstun = m.hs; d.kvx = a.face * m.kb; d.flash = m.hs;
      freeze = heavy ? 7 : 4; shake = heavy ? 9 : 4;
      const words = heavy ? ['¡POW!', '¡ZAS!', '¡BAM!'] : ['¡PAF!', '¡TAC!', '¡PUM!'];
      sparks.push({ x: tip, y: GROUND - fy, life: 22, txt: words[Math.floor(Math.random() * words.length)], big: heavy, col: heavy ? '#ff7a45' : '#ffd23f' });
      blip(heavy ? 130 : 180, 50, heavy ? 0.18 : 0.12, 'square', heavy ? 0.1 : 0.07);
    }
    if (d.x < 70 || d.x > W - 70) a.x -= a.face * m.kb * 2.5;
    if (d.hp <= 0) {
      d.ko = true; d.koT = 0; d.block = false; over = true; overT = 0; freeze = 14; shake = 12;
      winner = d === C ? 'p' : 'c'; wins[winner]++;
      blip(90, 30, 0.5, 'sawtooth', 0.1);
    }
  }

  // ---- Rival (CPU) -------------------------------------------------------------------------------
  function aiInput(f, o) {
    const inp = { left: 0, right: 0, down: 0, up: 0, block: 0, jab: 0, heavy: 0, khi: 0, klo: 0 };
    const dist = Math.abs(o.x - f.x), toward = o.x > f.x ? 1 : -1;
    const go = d => { if (d > 0) inp.right = 1; else inp.left = 1; };
    if (f.jumping) {
      if (!f.airUsed && dist < 125 && Math.random() < 0.22) { if (Math.random() < 0.5) inp.khi = 1; else inp.jab = 1; }
      return inp;
    }
    if (ai.timer > 0) {
      ai.timer--;
      if (ai.mode === 'crouch') inp.down = 1;
      if (ai.mode === 'block') inp.block = 1;
      if (ai.mode === 'retreat') go(-toward);
      return inp;
    }
    if (o.atk && o.atk.id !== ai.seen && dist < 125 && o.atk.t < o.atk.m.su) {
      ai.seen = o.atk.id;
      const r = Math.random();
      if (r < 0.34) { ai.mode = 'block'; ai.timer = 22; inp.block = 1; return inp; }
      if (r < 0.5) { ai.mode = 'crouch'; ai.timer = 24; inp.down = 1; return inp; }
      if (r < 0.62) { ai.mode = 'retreat'; ai.timer = 14; go(-toward); return inp; }
    }
    if (o.jumping && dist < 110 && Math.random() < 0.05) { inp.down = 1; inp.heavy = 1; return inp; }   // uppercut al que salta
    if (dist > 92) {
      if (dist > 150 && dist < 280 && Math.random() < 0.008) { go(toward); inp.up = 1; return inp; }
      go(toward); return inp;
    }
    if (--ai.cool <= 0) {
      ai.cool = 18 + Math.floor(Math.random() * 24);
      const r = Math.random();
      if (r < 0.24) inp.jab = 1;
      else if (r < 0.37) inp.heavy = 1;
      else if (r < 0.50) inp.klo = 1;
      else if (r < 0.62) inp.khi = 1;
      else if (r < 0.72) { inp.down = 1; inp.jab = 1; }
      else if (r < 0.79) { inp.down = 1; inp.heavy = 1; }
      else if (r < 0.88) { ai.mode = 'retreat'; ai.timer = 18; }
      else if (r < 0.95) { ai.mode = 'block'; ai.timer = 22; }
      else { ai.mode = 'crouch'; ai.timer = 22; }
    }
    return inp;
  }

  // ---- Paso de simulación (60 por segundo) -----------------------------------------------------
  const EMPTY = { left: 0, right: 0, down: 0, up: 0, block: 0, jab: 0, heavy: 0, khi: 0, klo: 0 };
  function step() {
    const pin = pollInput();
    if (over && overT > 70 && (pin.jab || pin.heavy || pin.khi || pin.klo)) { reset(); return; }
    if (freeze > 0) { freeze--; return; }
    if (intro > 0) { intro--; return; }
    if (over) { overT++; updateF(P, C, EMPTY); updateF(C, P, EMPTY); }
    else { updateF(P, C, pin); updateF(C, P, aiInput(C, P)); }
    tryHit(P, C); tryHit(C, P);
    if (P.z < 90 && C.z < 90) {                        // separar cuerpos (se puede saltar por arriba)
      const dx = C.x - P.x, min = 62;
      if (Math.abs(dx) < min) { const push = (min - Math.abs(dx)) / 2, s = dx >= 0 ? 1 : -1; P.x -= s * push; C.x += s * push; }
    }
    for (const f of [P, C]) {
      f.x = Math.max(46, Math.min(W - 46, f.x));
      if (f.flash > 0) f.flash--;
      if (f.blockT > 0) f.blockT--;
      if (f.chip > f.hp) f.chip = Math.max(f.hp, f.chip - 0.45);
    }
    for (const s of sparks) s.life--;
    sparks = sparks.filter(s => s.life > 0);
    if (shake > 0) shake--;
  }

  // ---- Dibujo ----------------------------------------------------------------------------------------
  const BUILDINGS = [[18, 110, 190], [140, 90, 140], [244, 140, 235], [398, 104, 170], [516, 150, 215], [682, 108, 150]];
  function blob(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
  function floorLine(c, col, dash) {
    c.fillStyle = col; c.fillRect(0, GROUND, W, H - GROUND);
    c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(0, GROUND); c.lineTo(W, GROUND); c.stroke();
    c.strokeStyle = dash; c.lineWidth = 3;
    for (let x = 20; x < W; x += 90) { c.beginPath(); c.moveTo(x, GROUND + 30); c.lineTo(x + 40, GROUND + 30); c.stroke(); }
  }
  function stCalle(c) {
    c.fillStyle = '#f3e8c8'; c.fillRect(0, 0, W, H);
    for (const [x, w, h] of BUILDINGS) {
      c.fillStyle = '#e6d6a8'; c.fillRect(x, GROUND - h, w, h);
      c.strokeStyle = 'rgba(20,20,20,.28)'; c.lineWidth = 2; c.strokeRect(x, GROUND - h, w, h);
      c.fillStyle = '#f3e8c8';
      for (let wy = GROUND - h + 18; wy < GROUND - 34; wy += 34)
        for (let wx = x + 14; wx < x + w - 22; wx += 30) c.fillRect(wx, wy, 14, 20);
    }
    floorLine(c, '#d9c58e', 'rgba(20,20,20,.25)');
  }
  function stPatio(c) {
    c.fillStyle = '#bfe3f2'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#fff';
    for (const [x, y] of [[110, 70], [470, 50], [660, 105]]) { blob(c, x, y, 20); blob(c, x + 24, y - 8, 26); blob(c, x + 52, y, 18); }
    c.fillStyle = '#e8c9a0'; c.fillRect(0, GROUND - 175, W, 175);
    c.fillStyle = '#b5523b'; c.fillRect(0, GROUND - 190, W, 16);
    c.strokeStyle = 'rgba(20,20,20,.35)'; c.lineWidth = 2; c.strokeRect(0, GROUND - 175, W, 175);
    c.fillStyle = '#9ec9dc';
    for (let x = 26; x < W - 40; x += 78) for (const y of [GROUND - 150, GROUND - 82]) { c.fillRect(x, y, 44, 50); c.strokeRect(x, y, 44, 50); }
    c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(765, GROUND); c.lineTo(765, GROUND - 130); c.lineTo(735, GROUND - 130); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(726, GROUND - 168, 10, 58); c.lineWidth = 3; c.strokeRect(726, GROUND - 168, 10, 58);
    c.strokeStyle = '#e4572e'; c.lineWidth = 4; c.beginPath(); c.moveTo(726, GROUND - 120); c.lineTo(700, GROUND - 120); c.stroke();
    floorLine(c, '#d99f5b', 'rgba(255,255,255,.7)');
  }
  function stTerraza(c) {
    const gr = c.createLinearGradient(0, 0, 0, GROUND); gr.addColorStop(0, '#12153a'); gr.addColorStop(1, '#4a2f66');
    c.fillStyle = gr; c.fillRect(0, 0, W, H);
    c.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) c.fillRect((i * 197) % W, (i * 89) % 200, 2, 2);
    c.fillStyle = '#f4efe0'; blob(c, 650, 85, 36); c.fillStyle = '#d9d2bd'; blob(c, 638, 78, 7); blob(c, 662, 98, 5);
    for (const [x, w, h] of BUILDINGS) {
      c.fillStyle = '#232a52'; c.fillRect(x, GROUND - h - 30, w, h + 30);
      c.fillStyle = '#ffd23f';
      for (let wy = GROUND - h - 10; wy < GROUND - 40; wy += 34) for (let wx = x + 14; wx < x + w - 22; wx += 30) if ((wx * 7 + wy * 3) % 5 < 2) c.fillRect(wx, wy, 12, 18);
    }
    floorLine(c, '#4a4f78', 'rgba(255,255,255,.18)');
  }
  function stGimnasio(c) {
    c.fillStyle = '#e9dcc0'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#c44536'; c.fillRect(250, 40, 300, 90); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(250, 40, 300, 90);
    c.fillStyle = '#f4efe0'; c.fillRect(300, 62, 200, 12); c.fillRect(330, 90, 140, 12);
    c.strokeStyle = 'rgba(20,20,20,.3)'; c.lineWidth = 3;
    for (let x = 20; x < 220; x += 22) { c.beginPath(); c.moveTo(x, GROUND - 230); c.lineTo(x, GROUND); c.stroke(); }
    c.fillStyle = '#8a6b4a';
    for (let i = 0; i < 4; i++) c.fillRect(580 + i * 24, GROUND - 40 - i * 30, 220 - i * 24, 40 + i * 30);
    floorLine(c, '#d9a35b', 'rgba(120,70,20,.35)');
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 4; c.beginPath(); c.arc(W / 2, GROUND + 40, 34, Math.PI, 0); c.stroke();
  }
  const STAGES = [{ name: 'Calle', draw: stCalle }, { name: 'Patio', draw: stPatio }, { name: 'Terraza', draw: stTerraza }, { name: 'Gimnasio', draw: stGimnasio }];
  // Alumnos: Bruno es el único dibujado; los "?" son lugares para los próximos (agregar sprites y sacar locked).
  const ROSTER = [{ name: 'Bruno' }, ...Array.from({ length: 11 }, () => ({ name: '?', locked: true }))];
  const sel = { mode: 0, p: 0, c: 0, stage: 0 };
  const MODES = [{ name: 'Uno contra Uno', on: 1 }, { name: 'Dos contra Dos', on: 0 }, { name: 'Torneo Escolar', on: 0 }];
  function recolor(img) {                              // color alternativo (rival): jean rojo, remera amarilla
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      const r = p[i], g = p[i + 1], b = p[i + 2];
      if (b > r + 25 && b > g) { p[i] = Math.min(255, b * 1.3); p[i + 1] = g * 0.45; p[i + 2] = r * 0.8; }
      else if (r > 215 && g > 215 && b > 215) { p[i + 1] = g * 0.92; p[i + 2] = b * 0.5; }
    }
    x.putImageData(d, 0, 0); return c;
  }
  function drawBG() { STAGES[sel.stage].draw(g); }

  // ---- Texto con tu abecedario (letras.png) ------------------------------------------------
  const GL = {"A": [2, 2, 73, 82, 74.4, 9.0, 57.0], "B": [77, 2, 79, 89, 75.0, 7.8, 62.4], "C": [158, 2, 68, 82, 73.8, 6.0, 55.8], "D": [228, 2, 81, 85, 75.0, 8.4, 66.0], "E": [311, 2, 71, 82, 73.8, 4.8, 55.8], "F": [384, 2, 92, 91, 74.4, 9.6, 72.6], "G": [478, 2, 77, 82, 73.8, 9.6, 60.0], "H": [557, 2, 81, 92, 75.0, 9.6, 63.6], "I": [640, 2, 67, 82, 74.4, 9.6, 49.2], "J": [709, 2, 73, 91, 74.4, 10.8, 57.0], "K": [784, 2, 80, 82, 74.4, 7.2, 63.6], "L": [2, 96, 74, 82, 73.8, 9.6, 58.2], "M": [78, 96, 97, 87, 74.4, 8.4, 78.6], "N": [177, 96, 86, 85, 73.8, 7.2, 69.6], "Ñ": [265, 96, 85, 98, 85.2, 9.0, 69.6], "O": [352, 96, 76, 82, 72.6, 7.2, 62.4], "P": [430, 96, 80, 91, 72.0, 10.8, 61.2], "Q": [512, 96, 77, 84, 72.6, 5.4, 65.4], "R": [591, 96, 78, 83, 73.8, 8.4, 64.2], "S": [671, 96, 80, 82, 72.6, 8.4, 65.4], "T": [753, 96, 77, 84, 74.4, 9.0, 60.6], "U": [2, 196, 85, 83, 73.8, 7.8, 67.8], "V": [89, 196, 70, 83, 73.8, 6.0, 57.0], "W": [161, 196, 104, 82, 72.6, 6.0, 91.8], "X": [267, 196, 69, 82, 72.6, 7.2, 55.2], "Y": [338, 196, 77, 91, 72.6, 8.4, 60.0], "Z": [417, 196, 73, 81, 72.0, 10.8, 53.4], "a": [492, 196, 62, 73, 63.6, 9.0, 45.0], "b": [556, 196, 63, 85, 76.8, 10.2, 44.4], "c": [621, 196, 52, 71, 63.0, 7.2, 36.6], "d": [675, 196, 65, 83, 74.4, 11.4, 43.8], "e": [742, 196, 56, 71, 63.0, 8.4, 39.0], "f": [800, 196, 56, 85, 76.2, 9.6, 37.8], "g": [2, 289, 69, 82, 63.0, 11.4, 48.0], "h": [73, 289, 62, 94, 76.8, 9.0, 44.4], "i": [137, 289, 47, 85, 75.6, 7.8, 30.0], "j": [186, 289, 49, 94, 75.6, 10.2, 31.2], "k": [237, 289, 64, 85, 76.2, 7.8, 48.6], "l": [303, 289, 52, 85, 76.2, 9.0, 34.8], "m": [357, 289, 83, 72, 63.0, 9.0, 65.4], "n": [442, 289, 66, 72, 63.0, 8.4, 48.6], "ñ": [510, 289, 66, 87, 78.0, 9.6, 48.0], "o": [578, 289, 61, 72, 63.0, 8.4, 42.0], "p": [641, 289, 61, 83, 63.6, 9.0, 44.4], "q": [704, 289, 62, 82, 63.0, 7.8, 42.6], "r": [768, 289, 55, 71, 63.0, 7.2, 40.8], "s": [825, 289, 65, 77, 68.4, 10.2, 45.6], "t": [2, 385, 52, 80, 72.0, 7.8, 34.8], "u": [56, 385, 64, 72, 63.0, 7.2, 48.6], "v": [122, 385, 63, 83, 73.8, 9.6, 43.8], "w": [187, 385, 79, 83, 73.8, 10.2, 59.4], "x": [268, 385, 65, 72, 63.0, 7.2, 48.6], "y": [335, 385, 64, 83, 63.0, 10.2, 46.2], "z": [401, 385, 52, 82, 63.0, 7.2, 36.0]};   // letra: [x, y, ancho, alto, línea base, margen izq., ancho del cuerpo]
  const LET = new Image(), letOk = new Promise(r => { LET.onload = LET.onerror = r; });
  LET.src = 'letras.png';
  function gtext(str) {
    const cv = document.createElement('canvas'), x = cv.getContext('2d'), GAP = 3, SP = 26;
    if (!LET.naturalWidth) {
      cv.width = str.length * 36 + 20; cv.height = 64; x.font = '48px Bangers, Impact, sans-serif'; x.textBaseline = 'middle';
      x.lineWidth = 6; x.strokeStyle = INK; x.strokeText(str, 10, 32); x.fillStyle = '#7dff2a'; x.fillText(str, 10, 32); return cv;
    }
    const gs = [...str].map(ch => GL[ch] || null), real = gs.filter(Boolean);
    let asc = 0, desc = 0, w = 0;
    for (const m of gs) { if (!m) { w += SP; continue; } asc = Math.max(asc, m[4]); desc = Math.max(desc, m[3] - m[4]); w += m[6] + GAP; }
    const f = real[0], l = real[real.length - 1], padL = f ? f[5] : 0, padR = l ? l[2] - l[5] - l[6] : 0;
    cv.width = Math.ceil(padL + w - GAP + padR); cv.height = Math.ceil(asc + desc);
    let cx = padL;
    for (const m of gs) { if (!m) { cx += SP; continue; } x.drawImage(LET, m[0], m[1], m[2], m[3], cx - m[5], asc - m[4], m[2], m[3]); cx += m[6] + GAP; }
    return cv;
  }

  function frameKey(f) {
    if (f.atk) { const m = f.atk.m; return f.atk.t < m.su ? (m.wind || 'idle') : m.frame; }
    if (f.jumping) return 'air';
    const c = f.crouch;
    if (f.ko || f.hitstun > 0 || f.block) return c ? 'c_idle' : 'idle';
    if (f.walk) return c ? CWALK[mod(Math.floor(f.wp / 11), CWALK.length)] : WALK[mod(Math.floor(f.wp / 12), WALK.length)];
    return c ? 'c_idle' : 'idle';
  }

  function drawF(f) {
    const key = frameKey(f), S = SPR[key], img = SETS[f.set][key];
    const w = S.w * SC, h = S.h * SC;
    const gy = GROUND - f.z;
    g.fillStyle = 'rgba(20,20,20,.18)';
    const sh = Math.max(0.4, 1 - f.z / 220);
    g.beginPath(); g.ellipse(f.x, GROUND + 5, 48 * sh, 7 * sh, 0, 0, Math.PI * 2); g.fill();
    g.save();
    let bob = 0;
    if (f.walk && !f.atk && !f.crouch && f.hitstun <= 0 && !f.jumping) bob = -Math.abs(Math.sin(f.wp * 0.26)) * 2.5;
    if (f.ko) {
      const p = Math.min(1, f.koT / 28), e = 1 - (1 - p) * (1 - p);
      g.translate(f.x, gy - (BWS / 2) * e); g.rotate(-f.face * (Math.PI / 2) * 0.94 * e);
    } else {
      const guarding = !f.atk && !f.jumping && (f.block || f.blockT > 0);
      g.translate(f.x, gy);
      if (guarding) {                                  // bloqueo sin sprite: se tira para atrás y esquiva por poco
        const k = f.blockT / 14;
        g.translate(-f.face * (6 + 7 * k), 0);
        g.rotate(-f.face * (0.17 + 0.13 * k));
        g.scale(1, 0.98);
      } else if (f.hitstun > 0) g.rotate(-f.face * 0.08);
    }
    g.scale(f.face, 1);
    if (f.flash > 0 && (f.flash % 4) < 2) g.globalAlpha = 0.55;
    g.drawImage(img, -S.ax * SC, -h + bob, w, h);
    g.restore();
  }

  function textOut(txt, x, y, size, fill, lw) {
    g.font = `${size}px Bangers, Impact, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = lw || 7; g.strokeStyle = INK; g.strokeText(txt, x, y);
    g.fillStyle = fill; g.fillText(txt, x, y);
  }

  function drawSpark(s) {
    const t = 1 - s.life / 22, r = (s.big ? 40 : 28) * (0.7 + 0.5 * Math.min(1, t * 3));
    g.save(); g.translate(s.x, s.y); g.rotate(t * 0.4);
    g.beginPath();
    for (let i = 0; i < 16; i++) { const rr = i % 2 ? r * 0.5 : r, a = i * Math.PI / 8; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    g.closePath(); g.fillStyle = s.col; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    g.restore();
    g.globalAlpha = Math.min(1, s.life / 10);
    textOut(s.txt, s.x, s.y - r - 14 - t * 14, s.big ? 34 : 26, '#fff', 6);
    g.globalAlpha = 1;
  }

  function drawBar(x, w, f, label, left) {
    const y = 16, h = 22;
    g.fillStyle = 'rgba(20,20,20,.85)'; g.fillRect(x, y, w, h);
    const fw = w * f.hp / MAXHP, cw = w * f.chip / MAXHP, bx = left ? x : x + w;
    g.fillStyle = '#ffd23f'; g.fillRect(left ? bx : bx - cw, y, cw, h);
    g.fillStyle = f.hp > 30 ? '#4fbf6a' : '#e4572e'; g.fillRect(left ? bx : bx - fw, y, fw, h);
    g.lineWidth = 3; g.strokeStyle = INK; g.strokeRect(x, y, w, h);
    g.font = '20px Bangers, Impact, sans-serif'; g.textBaseline = 'middle'; g.textAlign = left ? 'left' : 'right';
    g.fillStyle = sel.stage === 2 ? '#fff' : INK; g.fillText(label, left ? x + 2 : x + w - 2, y + h + 15);
  }

  function draw() {
    g.setTransform(RES, 0, 0, RES, 0, 0);
    g.clearRect(0, 0, W, H);
    g.save();
    if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.6);
    drawBG();
    drawF(C.x < P.x ? C : P);
    drawF(C.x < P.x ? P : C);
    for (const s of sparks) drawSpark(s);
    g.restore();
    drawBar(24, 320, P, 'VOS  ·  ' + wins.p, true);
    drawBar(W - 24 - 320, 320, C, wins.c + '  ·  CPU', false);
    if (intro > 0 && intro < 62) textOut(intro > 22 ? '¡PELEA!' : '¡YA!', W / 2, 140, 70, '#ffd23f', 9);
    if (over) {
      textOut('K.O.', W / 2, 120, 96, '#ff7a45', 11);
      if (overT > 40) textOut(winner === 'p' ? '¡GANASTE!' : 'PERDISTE', W / 2, 188, 40, '#fff', 7);
      if (overT > 70) textOut('Tocá un golpe para otra ronda', W / 2, 232, 24, '#ffd23f', 6);
    }
  }

  cv.addEventListener('pointerdown', () => { wake(); if (over && overT > 70) reset(); });

  // ---- Bucle principal ----------------------------------------------------------------------------------
  let last = 0, acc = 0, padPrev = {};
  function loop(ts) {
    const dt = Math.min(100, ts - (last || ts)); last = ts;
    if (running) {
      acc += dt;
      while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
      draw();
    } else {
      acc = 0;
      const pads = navigator.getGamepads ? navigator.getGamepads() : [], q = { a: 0, b: 0, l: 0, r: 0, u: 0, d: 0 };
      for (const p of pads) if (p) {
        const B = i => p.buttons[i] && p.buttons[i].pressed, ax = p.axes[0] || 0, ay = p.axes[1] || 0;
        if (B(0) || B(9)) q.a = 1; if (B(1)) q.b = 1;
        if (B(14) || ax < -0.5) q.l = 1; if (B(15) || ax > 0.5) q.r = 1; if (B(12) || ay < -0.5) q.u = 1; if (B(13) || ay > 0.5) q.d = 1;
      }
      const was = padPrev; padPrev = q;
      if (q.a && !was.a) { if (mstate === 'title') goSelect(); else confirmPick(); }
      else if (mstate !== 'title') {
        if (q.b && !was.b) back();
        const dx = (q.r && !was.r) - (q.l && !was.l), dy = (q.d && !was.d) - (q.u && !was.u);
        if (dx || dy) move(dx, dy);
      }
    }
    requestAnimationFrame(loop);
  }

  // ---- Menú ---------------------------------------------------------------------------------------
  const menu = document.getElementById('menu'), vid = document.getElementById('bgv'), snd = document.getElementById('snd');
  let running = false, ready = false, wantStart = false;
  function playBg() { try { const p = vid.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
  let mstate = 'title', armed = false;
  const K = { mode: 'mode', p1: 'p', cpu: 'c', stage: 'stage' };
  const $ = id => document.getElementById(id), put = (el, s) => el.replaceChildren(gtext(s));
  const enabled = (m, i) => m === 'mode' ? MODES[i].on : m === 'stage' || !ROSTER[i].locked;
  function buildTiles() {
    MODES.forEach((m, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mode' + (m.on ? '' : ' lock'); b.setAttribute('aria-label', m.name);
      b.append(gtext(m.name)); if (!m.on) { const t = gtext('Pronto'); t.className = 'soon'; b.append(t); }
      b.onclick = () => choose(i); $('modelist').append(b);
    });
    ROSTER.forEach((r, i) => {
      const b = document.createElement('button'), cv = document.createElement('canvas'), x = cv.getContext('2d');
      b.type = 'button'; b.className = 'tile' + (r.locked ? ' lock' : ''); b.setAttribute('aria-label', r.name); cv.width = cv.height = 120;
      if (r.locked) { x.font = '80px Bangers, Impact, sans-serif'; x.textAlign = 'center'; x.fillStyle = '#7d765f'; x.fillText('?', 60, 92); }
      else { const im = SETS['r' + i].idle; x.drawImage(im, 0, 4, im.width, im.width, 0, 0, 120, 120); }
      b.append(cv); b.onclick = () => choose(i); $('roster').append(b);
    });
    STAGES.forEach((s, i) => {
      const b = document.createElement('button'), cv = document.createElement('canvas'), x = cv.getContext('2d');
      b.type = 'button'; b.className = 'tile st'; b.setAttribute('aria-label', s.name);
      cv.width = 320; cv.height = 180; x.scale(0.4, 0.4); s.draw(x);
      b.append(cv); b.onclick = () => choose(i); $('stagelist').append(b);
    });
  }
  function portrait(cv, i, flip) {
    const im = SETS['r' + i + (flip ? 'b' : '')].idle, x = cv.getContext('2d');
    cv.width = im.width * 2; cv.height = im.height * 2;
    if (flip) { x.translate(cv.width, 0); x.scale(-1, 1); }
    x.drawImage(im, 0, 0, cv.width, cv.height);
  }
  function emptyPortrait(cv) {
    const im = SETS.r0.idle, x = cv.getContext('2d'); cv.width = im.width * 2; cv.height = im.height * 2;
    x.font = '200px Bangers, Impact, sans-serif'; x.textAlign = 'center'; x.fillStyle = 'rgba(255,255,255,.3)'; x.fillText('?', cv.width / 2, cv.height / 2 + 70);
  }
  function renderPick() {
    const m = mstate; let el;
    if (m === 'mode') { document.querySelectorAll('#modelist .mode').forEach((t, i) => t.classList.toggle('on', i === sel.mode)); return; }
    if (m === 'stage') {
      document.querySelectorAll('#stagelist .tile').forEach((t, i) => t.classList.toggle('on', i === sel.stage));
      el = $('sv'); const x = el.getContext('2d'), S = SPR.idle;
      x.clearRect(0, 0, W, H); STAGES[sel.stage].draw(x);
      x.drawImage(SETS['r' + sel.p].idle, 300 - S.ax * SC, GROUND - S.h * SC, S.w * SC, S.h * SC); put($('svname'), STAGES[sel.stage].name);
    } else {
      document.querySelectorAll('#roster .tile').forEach((t, i) => { t.classList.toggle('on', m === 'p1' && i === sel.p); t.classList.toggle('on2', m === 'cpu' && i === sel.c); t.classList.toggle('p1', m === 'cpu' && i === sel.p); });
      portrait($('pv'), sel.p, false); put($('pvname'), ROSTER[sel.p].name);
      if (m === 'cpu') { portrait($('pv2'), sel.c, true); put($('pv2name'), ROSTER[sel.c].name); } else { emptyPortrait($('pv2')); $('pv2name').replaceChildren(); }
      el = m === 'cpu' ? $('pv2') : $('pv');
    }
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }
  function openStep(s) {
    mstate = s; armed = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    menu.classList.toggle('picking', s !== 'title');
    document.querySelector('.menu-inner').hidden = s !== 'title'; $('pick').hidden = s === 'title';
    if (s === 'title') return;
    $('pk-mode').hidden = s !== 'mode'; $('pk-char').hidden = !(s === 'p1' || s === 'cpu'); $('pk-stage').hidden = s !== 'stage';
    put($('pktitle'), { mode: 'Seleccione el modo', p1: 'Selecciona tu Alumno', cpu: 'Selecciona al Rival', stage: 'Selecciona el Escenario' }[s]);
    put($('pkok'), s === 'stage' ? 'Pelear' : 'Elegir'); put($('tag1'), 'Vos'); put($('tag2'), 'CPU');
    renderPick();
  }
  function choose(i) {                                 // toque: el primero elige, el segundo confirma
    const m = mstate, k = K[m];
    if (!enabled(m, i)) { wake(); blip(150, 90, 0.12, 'sawtooth', 0.04); return; }
    if (sel[k] === i && armed) { confirmPick(); return; }
    sel[k] = i; armed = true; renderPick(); wake(); blip(520, 700, 0.05, 'square', 0.04);
  }
  function move(dx, dy) {
    const m = mstate, k = K[m], list = document.querySelectorAll(m === 'mode' ? '#modelist .mode' : m === 'stage' ? '#stagelist .tile' : '#roster .tile'), n = list.length;
    let cols = 0; for (const t of list) if (t.offsetTop === list[0].offsetTop) cols++;
    const d = m === 'mode' ? (dy || dx) : (dy ? dy * cols : dx), vert = dy && m !== 'mode';
    let i = sel[k], j = i;
    for (let t = 0; t < n; t++) { j += d; if (vert) { if (j < 0 || j >= n) break; } else j = (j + n) % n; if (enabled(m, j)) { i = j; break; } }
    if (i !== sel[k]) { sel[k] = i; armed = true; renderPick(); wake(); blip(520, 700, 0.05, 'square', 0.04); }
  }
  function confirmPick() {
    const m = mstate; if (!enabled(m, sel[K[m]])) return;
    wake(); blip(300, 600, 0.1, 'triangle', 0.06);
    const next = { mode: 'p1', p1: 'cpu', cpu: 'stage' }[m]; if (next) openStep(next); else launch();
  }
  function back() { openStep({ mode: 'title', p1: 'mode', cpu: 'p1', stage: 'cpu' }[mstate] || 'title'); }
  function menuKey(e) {
    const c = e.code, ok = c === 'Enter' || c === 'NumpadEnter' || c === 'Space';
    if (mstate === 'title') { if (ok) { e.preventDefault(); goSelect(); } return; }
    if (c === 'Escape' || c === 'Backspace') { e.preventDefault(); back(); }
    else if (ok) { e.preventDefault(); confirmPick(); }
    else {
      const dx = (c === 'ArrowRight' || c === 'KeyD') - (c === 'ArrowLeft' || c === 'KeyA'), dy = (c === 'ArrowDown' || c === 'KeyS') - (c === 'ArrowUp' || c === 'KeyW');
      if (dx || dy) { e.preventDefault(); move(dx, dy); }
    }
  }
  function goSelect() { if (!ready) { wantStart = true; return; } wake(); openStep('mode'); }
  function launch() {
    if (running) return;
    wake(); keys.clear();
    for (const k in touch) touch[k] = 0;
    document.querySelectorAll('[data-k].on').forEach(b => b.classList.remove('on'));
    reset(); running = true; menu.hidden = true;
    try { vid.pause(); } catch (_) {}
  }
  function showMenu() { running = false; menu.hidden = false; openStep('title'); keys.clear(); playBg(); }
  document.getElementById('startbtn').addEventListener('click', goSelect);
  $('pkback').addEventListener('click', back);
  $('pkok').addEventListener('click', confirmPick);
  document.getElementById('menubtn').addEventListener('click', showMenu);
  snd.addEventListener('click', () => {
    vid.muted = !vid.muted;
    snd.textContent = vid.muted ? 'SONIDO: NO' : 'SONIDO: SÍ';
    playBg();
  });
  playBg();

  Promise.all([...KEYS.map(k => loadImg(SPR[k].png).then(img => [k, img])), letOk]).then(list => {
    list.pop();
    ROSTER.forEach((r, i) => { if (r.locked) return; SETS['r' + i] = {}; SETS['r' + i + 'b'] = {}; for (const [k, img] of list) { SETS['r' + i][k] = img; SETS['r' + i + 'b'][k] = recolor(img); } });
    buildTiles(); put($('pkback'), 'Volver');
    reset();
    ready = true; if (wantStart) goSelect();
    const fontReady = document.fonts && document.fonts.load ? document.fonts.load('24px Bangers').catch(() => {}) : Promise.resolve();
    fontReady.then(() => requestAnimationFrame(loop));
  });
})();
</script>
